services:
  db:
    image: mysql:8.4
    container_name: rh-db
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets: [root_password]
    volumes:
      - dbdata:/var/lib/mysql
      - ./conf/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      - ./certs:/etc/mysql/certs:ro
      - ./conf/mysqld.my:/usr/sbin/mysqld.my:ro
      - ./conf/component_keyring_file.cnf:/usr/lib64/mysql/plugin//component_keyring_file.cnf:ro
      - ./keyring_data:/var/lib/mysql-keyring
    networks:
      rhnet:
        ipv4_address: 172.31.77.10

  client:
    image: mysql:8.4
    container_name: rh-client
    entrypoint: ["sleep", "infinity"]
    volumes:
      - /home/sara/kit:/kit:ro
      - ./certs:/etc/mysql/certs:ro
    networks:
      rhnet:
        ipv4_address: 172.31.77.20

secrets:
  root_password:
    file: ./secrets/root_password.txt

volumes:
  dbdata:

networks:
  rhnet:
    ipam:
      config:
        - subnet: 172.31.77.0/24
